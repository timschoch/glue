# The PR gate. One job running the ci stage of .skilly/verify.json: Actions
# rounds every job up to the minute, so one 5-minute job beats five 1-minute ones.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited] # edited: the pr workflow step reads the PR body
  push:
    branches: [main] # rename if the default branch is not main

# A newer push to the same ref cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the changed-files steps diff against origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/* # swap for node-version-file once the repo pins one
          cache: pnpm # keys off the lockfile
      - run: pnpm install --frozen-lockfile # lockfile only; a resolution drift fails here, not in prod
      # Browsers cost about a minute to install, so skip it in repos without e2e.
      - if: hashFiles('playwright.config.*') != ''
        run: pnpm exec playwright install --with-deps chromium
      - run: node .agents/skills/verify/scripts/verify.mjs ci
        env:
          # A PR runs only the tests its diff reaches. The release PR runs the full unit suite and the e2e smoke:
          # release-please updates it after each merge to main, so each merge gets one full run before a release.
          VERIFY_FULL: ${{ startsWith(github.head_ref, 'release-please--') && '1' || '' }}
          GLUE_API_TOKEN: ${{ secrets.GLUE_API_TOKEN }} # read token of the Project glue: the PR gate reads Decisions over Glue's HTTP API
