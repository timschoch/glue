# The PR gate. One job with one step per check: Actions rounds every job up to
# the minute, so one 5-minute job beats five 1-minute ones.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited] # edited: the pr workflow step reads the PR body
  push:
    branches: [main] # rename if the default branch is not main

# A newer push to the same ref cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      FULL: ${{ startsWith(github.head_ref, 'release-please--') && '1' || '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the changed-files steps diff against origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/* # swap for node-version-file once the repo pins one
          cache: pnpm # keys off the lockfile
      - run: pnpm install --frozen-lockfile # lockfile only; a resolution drift fails here, not in prod
      # Browsers cost about a minute to install, so skip it in repos without e2e.
      - if: hashFiles('playwright.config.*') != ''
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      # A PR runs only the tests its diff reaches. A diff with a migration or the lockfile runs all tests
      # (forceRerunTriggers in vitest.config.ts). The release PR runs the full unit suite and the e2e smoke:
      # release-please updates it after each merge to main, so each merge gets one full run before a release.
      - name: unit (changed)
        if: ${{ !env.FULL }}
        run: pnpm exec vitest run --changed origin/main --passWithNoTests
      - name: unit
        if: ${{ env.FULL }}
        run: pnpm exec vitest run --passWithNoTests
      - name: workflow guards # guard-workflow.mjs (Claude hook) and check-pr-workflow.mjs (PR gate), plain node:test
        run: node --test 'scripts/*.test.mjs' '.claude/hooks/*.test.mjs'
      # Issue link, a Decision line that names an existing Decision (read over Glue's HTTP API),
      # tests with source changes. Reads the PR body; outside a pull_request build it passes.
      - name: pr workflow
        run: pnpm exec tsx scripts/check-pr-workflow.ts
        env:
          GLUE_API_TOKEN: ${{ secrets.GLUE_API_TOKEN }} # read token of the Project glue
      - run: pnpm lint
      - run: pnpm build
      # The design system's Storybook deploys from main to its own Vercel project. A story that does not build fails here.
      - run: pnpm build-storybook
      - run: pnpm lint:styles # only Carbon tokens in src/design-system
      # High and critical advisories only. Lower levels fire on transitive dev dependencies.
      - run: pnpm audit --audit-level=high
      - name: e2e smoke # the critical paths, tagged @smoke; the rest runs nightly
        if: ${{ env.FULL }}
        run: pnpm exec playwright test --grep @smoke
