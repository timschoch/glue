# Product tier only: the long checks that must never gate a merge. Scheduled
# runs get delayed under load, so keep this off the required-checks list.
# verify exits 0 below the product tier, so an installed copy is inert elsewhere.
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC
  workflow_dispatch: {} # so a failure can be re-run without waiting a day

permissions:
  contents: read
  issues: write # the red-night issue

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every browser here, unlike the PR gate's single chromium.
      - if: hashFiles('playwright.config.*') != ''
        run: pnpm exec playwright install --with-deps
      - run: node .agents/skills/verify/scripts/verify.mjs nightly
      # A red night opens one issue. No second issue while one is open.
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-red --state open --json number --jq length)
          test "$open" != 0 || gh issue create --repo "$GITHUB_REPOSITORY" --label critical --label nightly-red \
            --title "Nightly red: $(date -u +%F)" --body "The nightly run failed: $RUN_URL"
