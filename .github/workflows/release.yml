name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
      # Deploy flow (product): main → Vercel preview, release → Vercel production.
      # Vercel's production branch is `release`; a new release fast-forwards it.
      - if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: steps.release.outputs.release_created == 'true'
        run: git push origin HEAD:release
