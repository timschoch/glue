name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push HEAD:release below

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflows, so the
      # required checks would never report. The App token makes them fire.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.SKILLY_APP_ID }}
          private-key: ${{ secrets.SKILLY_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
          token: ${{ steps.app-token.outputs.token }}
      # Deploy flow (product): main → Vercel preview, release → Vercel production.
      # Vercel's production branch is `release`; a new release fast-forwards it.
      - if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: steps.release.outputs.release_created == 'true'
        run: git push origin HEAD:release
