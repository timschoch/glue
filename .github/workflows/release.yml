name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the release commit and tag, push HEAD:release below
  pull-requests: write # the release PR
  actions: write # start ci.yml

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: node
      # A PR opened with the default token starts no workflow, so this starts
      # ci.yml on the release branch. That run writes the `verify` commit status.
      - if: steps.release.outputs.pr != ''
        run: gh workflow run ci.yml --ref "$(jq -r .headBranchName <<< "$PR")"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
      # Deploy flow (product): main → Vercel preview, release → Vercel production.
      # Vercel's production branch is `release`; a new release fast-forwards it.
      - if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - if: steps.release.outputs.release_created == 'true'
        run: git push origin HEAD:release
