name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push HEAD:release below

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflows, so the
      # required checks would never report. The App token makes them fire.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.SKILLY_APP_ID }}
          private-key: ${{ secrets.SKILLY_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: node
          token: ${{ steps.app-token.outputs.token }}
      # Deploy flow (product): main → Vercel preview, release → Vercel production.
      # Vercel's production branch is `release`; a new release fast-forwards it.
      - if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - if: steps.release.outputs.release_created == 'true'
        run: git push origin HEAD:release
