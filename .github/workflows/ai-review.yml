# On-demand review: a /ai-review comment runs the repo's own code-review skill
# on the runner. Never automatic on push — most PRs here are skill syncs, and
# reviewing those unprompted is pure waste. Billed to the OAuth subscription.
# Input names verified against anthropics/claude-code-action action.yml and
# docs/solutions.md, 2026-09-15.
name: AI review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  ai-review:
    # Cheap gate before the checkout: the action itself re-checks trigger_phrase.
    if: contains(github.event.comment.body, '/ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '/ai-review'
          prompt: |
            Review this pull request by running the repo's own code-review skill:
            read .agents/skills/code-review/SKILL.md and follow it.
            Post each finding as an inline comment via
            mcp__github_inline_comment__create_inline_comment with confirmed: true.
            Do not approve, do not request changes, do not push commits. Report only.
          # No --bare: it skips the skills and the CLAUDE.md this review reads.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr:*),Read,Grep,Glob"'
